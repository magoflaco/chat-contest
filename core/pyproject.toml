[project]
name = "chat-contest-core"
version = "0.1.0"
description = "Logica de Chat Contest: juez, puntaje, rondas y comandos"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "pydantic>=2.9", "PyYAML>=6.0"]

[project.scripts]
contest = "contest.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["contest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"
