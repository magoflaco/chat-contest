pistas:
  - "Agarrar siempre la moneda mas grande que entra no siempre da el minimo. Busca un contraejemplo con monedas 1, 3 y 4 para formar 6."
  - "Pensa en dp[x] = minima cantidad de monedas para formar exactamente x, y como se calcula dp[x] a partir de valores mas chicos."
editorial: |
  La trampa del problema es que el enfoque goloso (agarrar siempre la moneda mas
  grande que entra) no funciona. Con monedas de 1, 3 y 4 para formar 6, el goloso da
  4+1+1 = tres monedas, y el optimo es 3+3 = dos.

  La solucion es programacion dinamica sobre el monto:

      dp[0] = 0
      dp[x] = 1 + min(dp[x - v]) para cada moneda v <= x

  Se recorre `x` de 1 a M y para cada uno se prueban las K monedas. Si ningun
  `dp[x-v]` es alcanzable, `dp[x]` queda en infinito.

  Complejidad: O(M x K) tiempo y O(M) memoria. Con M = 10^5 y K = 100 son 10^7
  operaciones, que en Python entran si el ciclo interno es simple. Conviene usar una
  lista de enteros y evitar crear objetos adentro del ciclo.

  Este es el problema de "coin change" clasico, y aparece una y otra vez en
  olimpiadas disfrazado de otra cosa.
